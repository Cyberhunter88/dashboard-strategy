name: Release integrity

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and version files
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageVersion = require('./package.json').version;
          const lock = require('./package-lock.json');
          const lockVersion = lock.packages?.['']?.version ?? lock.version;
          const strategySource = fs.readFileSync('src/dashboard-strategy.ts', 'utf8');
          const strategyVersion = strategySource.match(/const STRATEGY_VERSION = '([^']+)';/)?.[1];
          const expectedTag = `v${packageVersion}`;
          const actualTag = process.env.GITHUB_REF_NAME;

          if (actualTag !== expectedTag) {
            throw new Error(`Git tag ${actualTag ?? '<missing>'} does not match expected ${expectedTag}`);
          }

          if (lockVersion !== packageVersion) {
            throw new Error(`package-lock.json version ${lockVersion ?? '<missing>'} does not match package.json version ${packageVersion}`);
          }

          if (strategyVersion !== packageVersion) {
            throw new Error(`src/dashboard-strategy.ts version ${strategyVersion ?? '<missing>'} does not match package.json version ${packageVersion}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify production artifacts
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test -s dist/dashboard-strategy.js
          test -s dist/dashboard-strategy.js.br
          test -s dist/dashboard-strategy.js.gz
          grep -q "Dashboard Strategy v$package_version loaded" dist/dashboard-strategy.js
          find dist -maxdepth 1 -name 'dashboard-strategy-core.*.js' -size +0c | grep -q .
          find dist -maxdepth 1 -name 'dashboard-strategy-editor.*.js' -size +0c | grep -q .
          find dist -maxdepth 1 -name 'dashboard-strategy-views.*.js' -size +0c | grep -q .
          find dist -maxdepth 1 -name 'dashboard-strategy-lit.*.js' -size +0c | grep -q .
