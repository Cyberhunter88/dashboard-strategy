name: HACS advisory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run HACS validation
        id: hacs
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: plugin

      - name: Explain advisory result
        if: steps.hacs.outcome == 'failure'
        run: |
          echo "::warning title=HACS validation is advisory::The inherited CC-BY-NC-SA-4.0 license is not recognized as an OSI-approved license by HACS. Review the HACS step for any additional failures."
