name: HACS Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # HACS resolves release assets from the repository being validated. Fork
    # pull requests commonly have no matching release, so validate same-repo
    # changes while keeping push, schedule, and manual checks active.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
          # The inherited CC-BY-NC-SA license is intentional but is not
          # recognized by HACS' license check. Ignore only that known check;
          # structural and release-asset failures must still fail the job.
          ignore: license
