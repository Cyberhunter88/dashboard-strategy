name: Release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v1.29.3
        required: true
        type: string
      publish:
        description: Publish the release after its assets pass validation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Require release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Validate and build release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/verify-version-sync.mjs --require-tag --tag "$RELEASE_TAG"
          npm run verify:release

      - name: Synchronize release prerelease state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(node scripts/read-version.mjs)"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F "prerelease=$PRERELEASE" >/dev/null

      - name: Upload complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.js dist/*.js.gz dist/*.js.br dist/*.LICENSE.txt --clobber -R "$GITHUB_REPOSITORY"

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-assets.mjs --tag "$RELEASE_TAG"

      - name: Publish release after asset validation
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false -R "$GITHUB_REPOSITORY"

      - name: Verify published release
        if: inputs.publish == true
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-assets.mjs --tag "$RELEASE_TAG" --require-published
