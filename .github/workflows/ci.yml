name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build, and production distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Verify quality, build, and production distribution
        run: npm run verify:release

  browser:
    name: Browser editor and responsive regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      # The system packages come from the Ubuntu mirrors. A runner-side DNS or
      # mirror outage must fail fast and retry instead of consuming the whole
      # job timeout, so each attempt is bounded and runs as root so that the
      # timeout can terminate the package manager as well.
      - name: Install Chromium system dependencies
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            if sudo env "PATH=$PATH" timeout --kill-after=10 150 \
              node node_modules/playwright/cli.js install-deps chromium; then
              exit 0
            fi
            echo "::warning::Installing Chromium system dependencies failed (attempt ${attempt} of 3)."
            sleep 15
          done
          echo "::error::Chromium system dependencies could not be installed after 3 attempts."
          exit 1
      - name: Run browser regressions
        run: npm run test:browser
