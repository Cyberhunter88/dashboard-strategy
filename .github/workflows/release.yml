name: Version Release

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - VERSION.txt

permissions:
  contents: write

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out version commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Version releases may only run from main"
            exit 1
          fi

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/read-version.mjs)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect existing release state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ -z "$TAG_COMMIT" ]]; then
              echo "Existing tag $RELEASE_TAG could not be resolved locally."
              exit 1
            fi
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $RELEASE_TAG points to $TAG_COMMIT, expected $GITHUB_SHA."
              exit 1
            fi
            TAG_EXISTS=true
            echo "Tag $RELEASE_TAG already exists on the expected commit."
          fi

          RELEASE_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            RELEASE_STATE=draft
          elif [[ "$RELEASE_DRAFT" == "false" ]]; then
            RELEASE_STATE=published
          else
            RELEASE_STATE=missing
          fi

          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_state=$RELEASE_STATE" >> "$GITHUB_OUTPUT"
          echo "Tag exists: $TAG_EXISTS; release state: $RELEASE_STATE"

      - name: Verify synchronized version files
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/verify-version-sync.mjs --require-tag --tag "$RELEASE_TAG"

      - name: Validate and build release
        run: npm run verify:release

      - name: Create and push annotated tag if missing
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Synchronize existing release prerelease state
        if: steps.existing.outputs.release_state != 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F "prerelease=$PRERELEASE" >/dev/null

      - name: Create draft release
        if: steps.existing.outputs.release_state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          RELEASE_ARGS=(--draft --generate-notes --verify-tag --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${RELEASE_ARGS[@]}"

      - name: Upload complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.js dist/*.js.gz dist/*.js.br dist/*.LICENSE.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify draft release assets
        if: steps.existing.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/verify-release-assets.mjs --tag "$RELEASE_TAG" --require-draft

      - name: Publish complete release
        if: steps.existing.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/verify-release-assets.mjs --tag "$RELEASE_TAG" --require-published
